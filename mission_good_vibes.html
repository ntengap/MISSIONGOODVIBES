<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mission Good Vibes</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;background:#20172f}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.stage{width:min(100%,520px);background:linear-gradient(145deg,#33224e,#623c77 55%,#8e4c79);border-radius:24px;padding:34px 24px;text-align:center;min-height:480px;display:flex;flex-direction:column;justify-content:center;gap:18px;box-shadow:0 16px 50px #0005}.pill{align-self:center;background:#ffffff26;border:1px solid #ffffff40;border-radius:99px;padding:8px 14px;font-size:12px;letter-spacing:1px}.emoji{font-size:58px}h1{font-size:clamp(24px,5vw,34px);line-height:1.22;margin:0}p{margin:0;line-height:1.6}.sub{font-size:13px;color:#f2d9ed}.options{display:grid;gap:12px}.option{width:100%;background:#fff;color:#422b50;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:750;cursor:pointer}.option:hover{background:#ffe3f1}.option:focus-visible{outline:3px solid #ffda64;outline-offset:3px}.again{background:#f9d1e9;color:#512c57}
</style></head><body><main class="stage" id="stage" aria-live="polite"></main><script>
const stage=document.getElementById('stage');let step=0;let lastAnswer='';
const questions=[
{emoji:'👀',q:'Important scientific question: can two people make each other smile without saying a word?',yes:'Absolutely. Smiles are dangerously contagious. 😁',no:'Interesting. The scientific committee requests further research. 🧐',skip:'A mysterious answer. The plot thickens. 🕵️'},
{emoji:'☕',q:'Would you accept a 30-second conversation with someone who occasionally thinks he is funny?',yes:'Excellent! His comedy career has been saved. 😂',no:'Fair. His jokes may require professional supervision. 🤦',skip:'The comedian remains under review. 🎭'},
{emoji:'✨',q:'Can a small hello sometimes make an ordinary day a little better?',yes:'A tiny hello. A surprisingly powerful invention! 🌞',no:'Fair enough. Some days need coffee first. ☕',skip:'A mysterious but respectable position. 😎'},
{emoji:'🤝',q:'Should two people be allowed to start a brand-new chapter with good vibes and zero pressure?',yes:'The Good Vibes Committee approves! 🎉',no:'No problem. Good vibes never require a signature. 😌',skip:'The committee respects your mystery. 🔍'},
{emoji:'🌷',q:'Final question: would you be open to a friendly hello from me sometime?',yes:'Wonderful. I promise the hello will be shorter than this game! 😄',no:'Totally fair. No pressure, and thank you for playing. 🌷',skip:'Mystery accepted. Thank you for playing! ✨'}
];
function element(tag,className,text){const el=document.createElement(tag);if(className)el.className=className;if(text!==undefined)el.textContent=text;return el}
function button(text,fn,extra=''){const b=element('button','option '+extra,text);b.type='button';b.addEventListener('click',fn);return b}
function render(){stage.replaceChildren();const x=questions[step];stage.append(element('span','pill',`MISSION GOOD VIBES · ${step+1}/5`),element('div','emoji',x.emoji),element('h1','',x.q));const opts=element('div','options');[['😊 Yes','yes'],['🙃 No','no'],['🤫 Prefer not to say','skip']].forEach(([label,a])=>opts.append(button(label,()=>reply(a))));stage.append(opts,element('p','sub','No wrong answers. No awkward penalties.'))}
function reply(answer){lastAnswer=answer;const x=questions[step];stage.replaceChildren(element('div','emoji','💌'),element('h1','',x[answer]),element('p','sub','Mission continues, if you want...'),button(step===questions.length-1?'See the final message 💫':'Next question →',()=>{step++;if(step<questions.length)render();else finish()},'again'))}
function finish(){const msg=lastAnswer==='yes'?'Maybe the next chapter starts with a simple hello. 😊':lastAnswer==='no'?'No expectations. Just wishing you a lovely day. 😊':'No answer needed. Wishing you a lovely day. 😊';stage.replaceChildren(element('div','emoji','🌸'),element('span','pill','MISSION COMPLETE'),element('h1','','Good vibes look good on you!'),element('p','','I made this little game for one reason: to bring a smile to your day.'),element('p','',msg),element('p','sub','No pressure, no hidden contract, and absolutely no paperwork. 😄'),button('Play again ↻',()=>{step=0;render()},'again'))}
render();
</script></body></html>
